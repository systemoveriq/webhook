<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook Inspector</title>
<style>
/* THEME TOKENS: swap these to match editpdf.ink exactly */
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#15192b; --muted:#6a7087; --line:#e2e5ec;
  --accent:#e5383b; --accent-ink:#fff; --sel:#fdeced; --code:#f0f2f6;
  --radius:10px; --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1220; --surface:#171b2e; --ink:#eef0f7; --muted:#9097b2; --line:#272c45;
  --sel:#2a1c27; --code:#0f1220;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block}
.urlbox{flex:1;min-width:260px;display:flex;gap:8px;align-items:center}
.urlbox code{flex:1;background:var(--code);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font:13px var(--mono);overflow:auto;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--radius);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
aside{background:var(--surface);border-right:1px solid var(--line);overflow:auto}
.count{padding:12px 16px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.item{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.item:hover{background:var(--code)}
.item.sel{background:var(--sel);box-shadow:inset 3px 0 var(--accent)}
.m{font:700 11px var(--mono);padding:2px 7px;border-radius:5px;background:var(--ink);color:var(--bg);align-self:start}
.m.POST{background:var(--accent);color:var(--accent-ink)}
.item small{color:var(--muted);grid-column:2}
section{overflow:auto;padding:20px}
.empty{color:var(--muted);text-align:center;margin-top:12vh}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.card h3{margin:0;padding:10px 16px;font-size:13px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
td{padding:7px 16px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}
tr:last-child td{border-bottom:0}
td:first-child{width:170px;color:var(--muted);font-weight:600;word-break:normal}
pre{margin:0;padding:14px 16px;font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto}
.hint{color:var(--muted);font-size:13px;padding:12px 16px}
@media (max-width:720px){main{grid-template-columns:1fr;grid-template-rows:200px 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Webhook Inspector</div>
  <div class="urlbox">
    <code id="url" aria-label="Your webhook URL"></code>
    <button id="copy" class="primary">Copy URL</button>
  </div>
  <button id="clear">Clear requests</button>
  <button id="new">New URL</button>
</header>
<main>
  <aside><div class="count" id="count">0 requests</div><div id="list"></div></aside>
  <section id="detail"><div class="empty">Waiting for requests.<br>Send one to your URL and it appears here.</div></section>
</main>
<script>
// Set this to your deployed Worker URL, no trailing slash.
const API = "https://YOUR-WORKER.your-subdomain.workers.dev";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); }));
let token, items = [], selected = null, lastSig = "";

function readToken() {
  const m = location.hash.match(/#!\/view\/([0-9a-f-]{36})/);
  if (m) return m[1];
  let t = null;
  try { t = localStorage.getItem("hook-token"); } catch (e) {}
  return t || uuid();
}
function setToken(t) {
  token = t;
  try { localStorage.setItem("hook-token", t); } catch (e) {}
  location.hash = "#!/view/" + t;
  $("url").textContent = `${API}/h/${t}`;
  items = []; selected = null; lastSig = ""; render(); poll();
}

async function poll() {
  try {
    const r = await fetch(`${API}/api/${token}/requests`);
    if (!r.ok) return;
    items = await r.json();
    const sig = items.map((i) => i.id).join();
    if (sig !== lastSig) { lastSig = sig; if (!selected && items[0]) selected = items[0].id; render(); }
  } catch (e) {}
}

function render() {
  $("count").textContent = `${items.length} request${items.length === 1 ? "" : "s"}`;
  $("list").innerHTML = items.map((i) => `
    <div class="item ${i.id === selected ? "sel" : ""}" data-id="${i.id}" tabindex="0">
      <span class="m ${i.method}">${esc(i.method)}</span><span>${esc(i.path === "/" ? "/" : i.path)}</span>
      <small>${new Date(i.time).toLocaleString()} · ${esc(i.ip || "unknown")}</small>
    </div>`).join("");
  const it = items.find((i) => i.id === selected);
  if (!it) { $("detail").innerHTML = '<div class="empty">Waiting for requests.<br>Send one to your URL and it appears here.</div>'; return; }
  const rows = (o) => Object.keys(o).length
    ? "<table>" + Object.entries(o).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("") + "</table>"
    : '<div class="hint">None</div>';
  let body = it.body;
  try { body = JSON.stringify(JSON.parse(it.body), null, 2); } catch (e) {}
  $("detail").innerHTML = `
    <div class="card"><h3>Request details</h3>${rows({
      URL: it.url, Method: it.method, Host: it.ip || "unknown", Date: new Date(it.time).toString(), Size: it.size + " bytes", ID: it.id })}</div>
    <div class="card"><h3>Query strings</h3>${rows(it.query)}</div>
    <div class="card"><h3>Headers</h3>${rows(it.headers)}</div>
    <div class="card"><h3>Request content</h3>${it.body ? `<pre>${esc(body)}</pre>` : '<div class="hint">(empty)</div>'}</div>`;
}

$("list").addEventListener("click", (e) => { const el = e.target.closest(".item"); if (el) { selected = el.dataset.id; render(); } });
$("list").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.click(); });
$("copy").onclick = async () => { try { await navigator.clipboard.writeText($("url").textContent); $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy URL", 1500); } catch (e) {} };
$("clear").onclick = async () => { await fetch(`${API}/api/${token}/requests`, { method: "DELETE" }); selected = null; poll(); };
$("new").onclick = () => setToken(uuid());
addEventListener("hashchange", () => { const m = location.hash.match(/#!\/view\/([0-9a-f-]{36})/); if (m && m[1] !== token) setToken(m[1]); });

setToken(readToken());
setInterval(poll, 3000);
</script>
</body>
</html>
